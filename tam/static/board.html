<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAM board</title>
<style>
  /* Palette roles. Light is the base; dark redefines only the tokens.
     Charts are single-series throughout, so the categorical CVD problem never
     arises. State and priority are never carried by colour alone — every one
     ships with a glyph and a text label, because status red vs green measures
     ΔE 4.1 under deuteranopia and amber sits at 1.79:1 on a light surface. */
  :root {
    color-scheme: light dark;
    --surface-0: #f2f2ef;   /* page */
    --surface-1: #fcfcfb;   /* cards, chart surface */
    --surface-2: #f7f7f5;   /* column wells */
    --line:      #e2e1dc;
    --line-soft: #eeedea;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --ink-3:     #86857f;
    --series-1:  #2a78d6;
    --series-1-soft: #cde2fb;
    --good:      #0ca30c;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #d03b3b;
    --accent:    #2a78d6;
    --accent-wash: #eaf2fd;
    --shadow:    0 1px 2px rgba(11,11,11,.06), 0 1px 3px rgba(11,11,11,.04);
    --shadow-lg: 0 12px 32px rgba(11,11,11,.16);
    --r:  10px;
    --r-s: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #201f1e;
      --line:      #34332f;
      --line-soft: #292825;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --ink-3:     #8d8c83;
      --series-1:  #3987e5;
      --series-1-soft: #184f95;
      --accent:    #3987e5;
      --accent-wash: #14273f;
      --shadow:    0 1px 2px rgba(0,0,0,.5);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #201f1e;
    --line: #34332f; --line-soft: #292825;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8d8c83;
    --series-1: #3987e5; --series-1-soft: #184f95;
    --accent: #3987e5; --accent-wash: #14273f;
    --shadow: 0 1px 2px rgba(0,0,0,.5); --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--surface-0); color: var(--ink);
    font: 13.5px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1,h2,h3 { margin: 0; font-weight: 620; letter-spacing: -.011em; }
  .num { font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------- chrome */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--surface-1);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 15px; }
  .brand span { color: var(--ink-3); font-weight: 500; margin-left: 7px; font-size: 12px; }
  .spacer { flex: 1; }
  input[type=search], select, input[type=text], input[type=date], textarea {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-s);
    background: var(--surface-2); color: var(--ink); min-width: 0;
  }
  input[type=search] { width: 210px; }
  .btn {
    padding: 6px 11px; border: 1px solid var(--line); border-radius: var(--r-s);
    background: var(--surface-2); cursor: pointer; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-pri:hover { color: #fff; filter: brightness(1.08); }
  .btn-sm { padding: 3px 8px; font-size: 12px; }
  .btn-danger:hover { border-color: var(--critical); color: var(--critical); }
  :is(button,input,select,textarea,[tabindex]):focus-visible,
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; }
  main { padding: 16px 18px 48px; }

  /* --------------------------------------------------------- stat tiles */
  .kpis {
    display: grid; gap: 12px; margin-bottom: 16px;
    /* cap the width: a two-digit number in a 380px tile reads as an error */
    grid-template-columns: repeat(auto-fit, minmax(196px, 268px));
    justify-content: start;
  }
  .tile {
    background: var(--surface-1); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow);
    display: grid; gap: 7px; align-content: start;
  }
  .tile-label {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .tile-value { font-size: 27px; font-weight: 660; line-height: 1.05; letter-spacing: -.02em; }
  .tile-value small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
  .tile-note { font-size: 12px; color: var(--ink-2); }
  .att { display: grid; gap: 3px; margin-top: 1px; }
  .att a { display: flex; align-items: center; gap: 7px; font-size: 11.5px;
           text-decoration: none; color: var(--ink-2); }
  .att a:hover { color: var(--accent); }
  .att .k { font: 500 11px/1 ui-monospace, Menlo, monospace; color: var(--ink-3); min-width: 52px; }

  /* meter: a single ratio against a limit, same-ramp track */
  .meter { height: 7px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 4px; background: var(--series-1); }
  .meter.over > i { background: var(--critical); }

  /* ------------------------------------------------------------- board */
  /* The board is a vertical stack of swimlanes; one lane per epic, plus a
     trailing lane for issues with no parent. Flat mode renders a single
     headerless lane, so both modes share one code path.
     overflow-x lives on .board, not on the lane: a scrollbar per lane would
     let lanes drift out of step and destroy the column alignment that makes
     the grid readable. Every lane renders every status, so widths match. */
  .board { display: grid; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
  .lane-cols {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(248px, 1fr);
    gap: 12px; align-items: start;
  }
  .lane.collapsed .lane-cols { display: none; }
  .lane-head {
    display: flex; align-items: center; gap: 9px; padding: 2px 2px 8px;
    cursor: pointer; user-select: none;
  }
  .lane-head:hover .lane-title { color: var(--ink); }
  .lane-caret {
    color: var(--ink-3); font-size: 10px; width: 10px; flex: none;
    transition: transform .12s ease;
  }
  .lane.collapsed .lane-caret { transform: rotate(-90deg); }
  .lane-key {
    font: 600 11.5px/1 ui-monospace, Menlo, monospace; color: var(--ink-3);
  }
  .lane-title {
    font-size: 12.5px; font-weight: 620; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lane-open {
    font-size: 11px; color: var(--ink-3); text-decoration: none;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; flex: none;
  }
  .lane-open:hover { color: var(--accent); border-color: var(--accent); }
  .lane-stat {
    margin-left: auto; flex: none; font-size: 11.5px; color: var(--ink-3);
    display: flex; align-items: center; gap: 8px;
  }
  .lane-stat b { font-weight: 600; color: var(--ink-2); }
  .lane-stat .wip-over { color: var(--critical); }
  /* Next-up hint: what this lane should pull, or why it can't. */
  .lane-next {
    font-size: 11.5px; color: var(--ink-3); display: inline-flex; gap: 5px;
    align-items: baseline; white-space: nowrap;
  }
  .lane-next .arrow { color: var(--accent); font-weight: 700; }
  .lane-next a {
    color: var(--accent); text-decoration: none;
    font: 500 11.5px/1 ui-monospace, Menlo, monospace;
  }
  .lane-next a:hover { text-decoration: underline; }
  .lane-next.is-idle { color: var(--warning); }
  .lane-next.is-full { color: var(--ink-3); }
  .lane-rule { height: 1px; background: var(--line-soft); margin: 0 0 10px; }
  .col {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r); display: flex; flex-direction: column;
  }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px 9px;
    border-bottom: 1px solid var(--line);
  }
  .col-title {
    font-size: 11px; font-weight: 680; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink-2);
  }
  .count { margin-left: auto; color: var(--ink-3); font-size: 12px; }
  .col-body { padding: 9px; display: grid; gap: 9px; min-height: 54px; }
  .col.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .col.drop-no { opacity: .4; }
  .col.over-wip .col-head { box-shadow: inset 0 2px 0 var(--critical); }

  /* -------------------------------------------------------------- card */
  .card {
    background: var(--surface-1); border: 1px solid var(--line);
    border-radius: var(--r-s); padding: 10px 11px; cursor: pointer;
    box-shadow: var(--shadow); display: grid; gap: 7px;
    transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: var(--accent); }
  .card.dragging { opacity: .35; transform: scale(.99); }
  .card-top { display: flex; align-items: center; gap: 7px; }
  .key { font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-3); }
  .card-title { font-size: 13.5px; line-height: 1.38; overflow-wrap: anywhere; }
  .card.closed .card-title { text-decoration: line-through; color: var(--ink-3); }
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }

  /* priority: colour reinforces, the text carries it */
  .pri {
    font: 700 10px/1 ui-monospace, monospace; letter-spacing: .04em;
    padding: 3px 5px; border-radius: 4px; border: 1px solid transparent;
  }
  .pri.p0 { background: var(--critical); color: #fff; }
  .pri.p1 { background: var(--serious); color: #1a1a19; }
  .pri.p2 { background: var(--line-soft); color: var(--ink-2); border-color: var(--line); }
  .pri.p3 { background: transparent; color: var(--ink-3); border-color: var(--line); }

  .chip {
    padding: 2px 7px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); font-size: 11px; color: var(--ink-2);
  }
  .due.late { color: var(--critical); font-weight: 600; }
  .due.today { color: var(--serious); font-weight: 600; }

  /* state: glyph + label, never colour alone */
  .state { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
  .state .g { font-size: 10px; line-height: 1; }
  .state.running    { color: var(--good); }
  .state.pending    { color: var(--ink-2); }
  .state.succeeded  { color: var(--good); }
  .state.failed,
  .state.stopped,
  .state.missing    { color: var(--critical); }
  .state.unreachable{ color: var(--serious); }
  .state.present,
  .state.unknown    { color: var(--ink-3); }

  .spark { display: flex; align-items: center; gap: 7px; }
  .spark-name { font-size: 10.5px; color: var(--ink-3); min-width: 52px; }
  .spark-val { font-size: 11.5px; font-weight: 600; }

  /* ------------------------------------------------------------ drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(11,11,11,.42); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .16s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: min(600px, 100vw);
    background: var(--surface-1); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lg); z-index: 41; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s ease; padding: 18px 20px 40px;
  }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 17px; line-height: 1.3; margin-top: 2px; }
  .dhead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .field { display: grid; gap: 5px; margin-bottom: 11px; }
  .field label, .sec-title {
    font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .sec { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 15px; }
  .sec-title { margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
  .entry { padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .entry:last-child { border-bottom: 0; }
  .who { color: var(--ink-3); font-size: 11px; }
  .hist { font: 400 11px/1.6 ui-monospace, Menlo, monospace; color: var(--ink-2); }
  textarea { width: 100%; resize: vertical; min-height: 62px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }

  /* target rows */
  .target { display: grid; gap: 5px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .target:last-child { border-bottom: 0; }
  .target-top { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
  .target-top b { font-weight: 620; }
  .target-gap { margin-left: auto; font-size: 11.5px; }

  /* chart */
  figure.chart { margin: 0; display: grid; gap: 8px; }
  figcaption { font-size: 12px; color: var(--ink-2); }
  .chart-wrap { position: relative; }
  svg.plot { display: block; width: 100%; height: auto; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; opacity: 0;
    background: var(--surface-1); border: 1px solid var(--line);
    border-radius: var(--r-s); box-shadow: var(--shadow-lg);
    padding: 7px 9px; font-size: 11.5px; white-space: nowrap;
    transition: opacity .1s;
  }
  .tip.on { opacity: 1; }
  .tip b { font-weight: 650; }
  table.data { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.data th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 4px 8px 4px 0; }
  table.data td { padding: 3px 8px 3px 0; border-top: 1px solid var(--line-soft); }

  dialog {
    border: 1px solid var(--line); border-radius: var(--r); padding: 20px;
    background: var(--surface-1); color: var(--ink); width: min(470px, 92vw);
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgba(11,11,11,.42); }

  #toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            z-index: 60; display: grid; gap: 8px; width: min(560px, 92vw); }
  .toast { padding: 9px 13px; border-radius: var(--r-s); font-size: 12.5px;
           border: 1px solid var(--line); background: var(--surface-1);
           box-shadow: var(--shadow-lg); display: flex; gap: 8px; align-items: center; }
  .toast.err { border-color: var(--critical); color: var(--critical); }
  .toast.ok  { border-color: var(--good); color: var(--good); }

  .empty { color: var(--ink-3); font-size: 11.5px; text-align: center; padding: 10px 2px; }
  .hidden { display: none !important; }
  @media (max-width: 680px) {
    .lane-cols { grid-auto-flow: row; grid-auto-columns: auto; }
    input[type=search] { width: 140px; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">TAM<span id="proj"></span></span>
  <input type="search" id="q" placeholder="Search title and body…" aria-label="Search">
  <select id="fpri" aria-label="Priority filter">
    <option value="">All priorities</option>
    <option value="p0">p0 critical</option><option value="p1">p1 high</option>
    <option value="p2">p2 medium</option><option value="p3">p3 low</option>
  </select>
  <label class="toggle"><input type="checkbox" id="fover"> Overdue</label>
  <label class="toggle"><input type="checkbox" id="fdone"> Show done</label>
  <label class="toggle"><input type="checkbox" id="fepic" checked> Group by epic</label>
  <span class="spacer"></span>
  <span id="status" style="color:var(--ink-3);font-size:11.5px"></span>
  <button class="btn" id="refresh" title="Refresh (r)">Refresh</button>
  <button class="btn btn-pri" id="new">+ New</button>
</header>

<main>
  <section class="kpis" id="kpis" aria-label="Summary"></section>
  <div class="board" id="board"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Issue detail"></aside>

<dialog id="newdlg">
  <h2 style="margin-bottom:14px">New issue</h2>
  <form method="dialog" id="newform">
    <div class="field"><label for="n-title">Title</label>
      <input type="text" id="n-title" required autocomplete="off"></div>
    <div class="field"><label for="n-body">Description</label>
      <textarea id="n-body"></textarea></div>
    <div class="grid2">
      <div class="field"><label for="n-pri">Priority</label><select id="n-pri"></select></div>
      <div class="field"><label for="n-type">Type</label><select id="n-type"></select></div>
      <div class="field"><label for="n-status">Status</label><select id="n-status"></select></div>
      <div class="field"><label for="n-due">Due</label><input type="date" id="n-due"></div>
    </div>
    <div class="field"><label for="n-labels">Labels (space separated)</label>
      <input type="text" id="n-labels" autocomplete="off"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn btn-pri" value="create">Create</button>
    </div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const TOKEN = __TAM_TOKEN__;

/* ------------------------------------------------------------- api layer */
class ApiError extends Error {
  constructor(e) { super(e.message || "request failed"); this.info = e; }
}
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json",
               ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let json;
  try { json = await res.json(); }
  catch { throw new ApiError({ message: `HTTP ${res.status}` }); }
  if (!json.ok) throw new ApiError(json.error || { message: `HTTP ${res.status}` });
  return json.data;
}

/* ---------------------------------------------------------------- state */
let WF = null, BOARD = null, openKey = null, dragKey = null;

const $ = (s, r = document) => r.querySelector(s);
const el = (t, p = {}, ...kids) => {
  const n = Object.assign(document.createElement(t), p);
  for (const k of kids.flat()) if (k != null)
    n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const svgEl = (t, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const TYPE_GLYPH = { task: "◻", bug: "▲", chore: "⚙", spike: "◈" };
/* every state ships a glyph so colour is never the only channel */
const STATE_GLYPH = {
  running: "▶", pending: "◌", succeeded: "✓", failed: "✕", stopped: "■",
  present: "•", missing: "✕", unreachable: "⚠", unknown: "?",
};

function toast(msg, kind = "") {
  const t = el("div", { className: "toast " + kind }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 7000 : 3000);
}
const fail = e => toast(e instanceof ApiError ? e.message : String(e?.message || e), "err");

/* ------------------------------------------------------------- loading */
function filters() {
  const p = new URLSearchParams();
  const q = $("#q").value.trim(), pri = $("#fpri").value;
  if (q) p.set("text", q);
  if (pri) p.set("priority", pri);
  if ($("#fover").checked) p.set("overdue", "true");
  if ($("#fdone").checked) p.set("include_closed", "true");
  p.set("sort", "priority");
  return p;
}

async function load(quiet) {
  if (!quiet) $("#status").textContent = "loading…";
  try {
    BOARD = await api("GET", "/api/board?" + filters());
    WF = BOARD.workflow;
    render();
    $("#status").textContent = "updated " +
      new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) { fail(e); $("#status").textContent = "error"; }
}

/* ------------------------------------------------------------- helpers */
function dueInfo(iso) {
  if (!iso) return null;
  if (iso < WF.today) {
    const d = Math.round((Date.parse(WF.today) - Date.parse(iso)) / 864e5);
    return { cls: "late", text: d + "d late" };
  }
  if (iso === WF.today) return { cls: "today", text: "today" };
  return { cls: "", text: iso.slice(5) };
}
const fmt = v => Math.abs(v) >= 100 ? v.toFixed(0)
               : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3);

function stateBadge(state, label) {
  const s = state || "unknown";
  return el("span", { className: "state " + s, title: label || s },
    el("span", { className: "g" }, STATE_GLYPH[s] || "?"),
    el("span", {}, label || s));
}

/* ---------------------------------------------------------- sparkline */
/* Micro-form: single series, no axes, no legend — the label names it.
   2px stroke, end point marked so "where it is now" reads without a tooltip. */
function sparkline(values, w = 74, h = 24) {
  const svg = svgEl("svg", { class: "plot", width: w, height: h,
                             viewBox: `0 0 ${w} ${h}`, role: "img" });
  if (values.length < 2) return svg;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1, pad = 3;
  const x = i => (i / (values.length - 1)) * (w - 2 * pad) + pad;
  const y = v => h - pad - ((v - min) / span) * (h - 2 * pad);
  const d = values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  svg.append(svgEl("path", { d, fill: "none", stroke: "var(--series-1)",
                             "stroke-width": 2, "stroke-linecap": "round",
                             "stroke-linejoin": "round" }));
  svg.append(svgEl("circle", { cx: x(values.length - 1), cy: y(values.at(-1)),
                               r: 3, fill: "var(--series-1)" }));
  return svg;
}

/* --------------------------------------------------------- stat tiles */
function tile(label, value, unit, note, meter) {
  const t = el("div", { className: "tile" },
    el("div", { className: "tile-label" }, label),
    el("div", { className: "tile-value num" }, String(value),
       unit ? el("small", {}, unit) : null));
  if (meter) {
    const bar = el("div", { className: "meter" + (meter.over ? " over" : "") },
                   el("i", { style: `width:${Math.min(100, meter.pct)}%` }));
    t.append(bar);
  }
  if (note) t.append(el("div", { className: "tile-note" }, note));
  return t;
}

/* Keys that act as epics in the current view: a parent something visible points
   at. Shared by the WIP count and the lane split so the two never disagree. */
function epicKeys(issues) {
  return new Set(issues.map(i => i.parent).filter(Boolean));
}

function renderKpis() {
  const box = $("#kpis"); box.textContent = "";
  const st = BOARD.stats;
  const limit = WF.wip_limit || 3;

  /* Count work in flight, not containers. st.by_status.in_progress includes the
     epics, and they sit in_progress for the life of the project -- four of them
     pinned this tile permanently over the limit, so it signalled nothing. This
     counts the same cards the lanes do, which is what the limit is about. */
  const epics = epicKeys(BOARD.issues);
  const inProg = BOARD.issues
    .filter(i => i.status === "in_progress" && !epics.has(i.key)).length;

  const targets = Object.values(BOARD.targets).flat();
  const met = targets.filter(t => t.met).length;

  const attention = Object.entries(BOARD.watches).flatMap(([k, ws]) =>
    ws.filter(w => ["failed", "stopped", "missing", "unreachable"].includes(w.state))
      .map(w => ({ key: k, ...w })));

  box.append(
    tile("Open", st.open, null,
         `${st.by_status.backlog || 0} backlog · ${st.by_status.todo || 0} todo`),
    tile("In progress", inProg, `/ ${limit}`,
         (inProg > limit ? `${inProg - limit} over the WIP limit` : "within limit")
           + (epics.size ? ` · ${epics.size} epics not counted` : ""),
         { pct: (inProg / limit) * 100, over: inProg > limit }),
    tile("Targets met", targets.length ? `${met}/${targets.length}` : "—", null,
         targets.length ? `${targets.length - met} still short` : "no targets set",
         targets.length ? { pct: (met / targets.length) * 100 } : null),
    (() => {
      const t = tile("Needs attention", attention.length, null,
                     attention.length ? "" : "all watched jobs healthy");
      if (attention.length) {
        const list = el("div", { className: "att" });
        for (const a of attention.slice(0, 3))
          list.append(el("a", { href: "#" + a.key, title: `${a.provider}:${a.ref}` },
            el("span", { className: "k" }, a.key),
            stateBadge(a.state, a.state)));
        if (attention.length > 3)
          list.append(el("span", { className: "tile-note" },
                         `+${attention.length - 3} more`));
        t.append(list);
      }
      return t;
    })(),
  );
}

/* --------------------------------------------------------------- board */
function card(issue) {
  const closed = WF.closed_statuses.includes(issue.status);
  const due = dueInfo(issue.due_date);
  const meta = [
    el("span", { className: "pri " + issue.priority, title: WF.priority_labels[issue.priority] },
       issue.priority),
    el("span", { title: issue.type, style: "font-size:11px;color:var(--ink-3)" },
       TYPE_GLYPH[issue.type] || "◻"),
  ];
  if (due && !closed) meta.push(el("span", { className: "due " + due.cls }, due.text));
  if (issue.assignee) meta.push(el("span", { className: "chip" }, "@" + issue.assignee));
  // In lane mode the parent is the lane header, so repeating it on every card
  // is pure noise -- show the chip only when the board is flat.
  if (issue.parent && !$("#fepic").checked)
    meta.push(el("span", { className: "chip", title: "subtask of " + issue.parent },
                 "↳ " + issue.parent));
  for (const l of issue.labels.slice(0, 3)) meta.push(el("span", { className: "chip" }, l));

  const node = el("div", {
    className: "card" + (closed ? " closed" : ""), draggable: true, tabIndex: 0,
    role: "button", "aria-label": `${issue.key} ${issue.title}`,
  },
    el("div", { className: "card-top" },
      el("span", { className: "key" }, issue.key),
      ...(BOARD.watches[issue.key] || []).slice(0, 1)
          .map(w => el("span", { style: "margin-left:auto" },
                       stateBadge(w.state, w.state)))),
    el("div", { className: "card-title" }, issue.title),
    el("div", { className: "meta" }, meta));

  // sparkline for the issue's headline metric, if it has one
  const series = BOARD.series[issue.key];
  if (series) {
    const name = ["map50", "recall", "precision", "map50_95"]
      .find(n => series[n]) || Object.keys(series)[0];
    const vals = series[name];
    const latest = BOARD.metrics[issue.key]?.[name];
    node.append(el("div", { className: "spark" },
      el("span", { className: "spark-name" }, name),
      sparkline(vals),
      el("span", { className: "spark-val num" }, latest ? fmt(latest.value) : "")));
  }

  node.dataset.key = issue.key;
  node.addEventListener("click", () => openDrawer(issue.key));
  node.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDrawer(issue.key); }
  });
  node.addEventListener("dragstart", ev => {
    dragKey = issue.key; node.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", issue.key);
    markTargets(issue.status, node.closest(".lane"));
  });
  node.addEventListener("dragend", () => {
    dragKey = null; node.classList.remove("dragging"); clearTargets();
  });
  return node;
}

/* Drop targets are scoped to the dragged card's own lane. Lighting up every
   lane's matching column implies dropping there would re-parent the issue,
   which it does not -- a drop only ever changes status. */
function markTargets(from, laneEl) {
  const ok = WF.transitions[from] || [];
  const scope = laneEl || document;
  for (const c of scope.querySelectorAll(".col")) {
    c.classList.toggle("drop-ok", ok.includes(c.dataset.status));
    c.classList.toggle("drop-no", c.dataset.status !== from && !ok.includes(c.dataset.status));
  }
}
const clearTargets = () => document.querySelectorAll(".col")
  .forEach(c => c.classList.remove("drop-ok", "drop-no"));

/* ------------------------------------------------------------ swimlanes */
/* Must match core.queue.NO_EPIC -- the board matches lanes against the pull
   queue by this key, and a divergence silently blanks every next-up hint. */
const LANE_NONE = "_none";
const collapsed = new Set(
  JSON.parse(localStorage.getItem("tam.lanes.collapsed") || "[]"));
const saveCollapsed = () => localStorage.setItem(
  "tam.lanes.collapsed", JSON.stringify([...collapsed]));

/* Split the visible issues into lanes.

   A lane is an epic -- a parent that at least one visible issue points at.
   The epic itself is deliberately NOT dealt into the columns: its status is an
   aggregate of its children, so a container card in one column says nothing,
   and four of them permanently pinned the in_progress count over the WIP limit.
   It becomes the lane header instead.

   A parent filtered out of the result set still gets a lane, keyed by its key
   with no title, so searching never silently regroups its children. */
function lanesOf(issues) {
  const byKey = new Map(issues.map(i => [i.key, i]));
  const parents = epicKeys(issues);

  const lanes = new Map();
  const laneFor = key => {
    if (!lanes.has(key)) lanes.set(key, { key, epic: byKey.get(key) || null, issues: [] });
    return lanes.get(key);
  };

  for (const i of issues) {
    if (parents.has(i.key)) continue;            // an epic: header, not a card
    laneFor(i.parent || LANE_NONE).issues.push(i);
  }

  // Epics first, in the order the API returned them; loose issues last.
  const ordered = [];
  for (const i of issues) if (parents.has(i.key) && lanes.has(i.key)) ordered.push(lanes.get(i.key));
  for (const [key, lane] of lanes)
    if (key !== LANE_NONE && !lane.epic) ordered.push(lane);   // parent not in view
  if (lanes.has(LANE_NONE)) ordered.push(lanes.get(LANE_NONE));
  return ordered;
}

/* The lane's next-up hint, from the same /api/board payload as the cards.
   Three states worth distinguishing: something can start, the queue is backed up
   behind a full lane, or there is room and nothing promoted to todo. */
function laneNext(laneKey) {
  const pull = BOARD.pull;
  if (!pull) return null;
  const mine = pull.ready.filter(r => r.lane === laneKey);
  const top = mine.find(r => r.pullable);
  if (top) {
    return el("span", { className: "lane-next", title: top.title },
      el("span", { className: "arrow" }, "→"),
      el("a", { href: "#" + top.key,
                onclick: ev => { ev.stopPropagation(); openDrawer(top.key); } }, top.key),
      el("span", null, "next"));
  }
  if (mine.length) {
    return el("span", { className: "lane-next is-full" },
      el("span", null, `${mine.length} waiting on a free slot`));
  }
  const starved = (pull.starved || []).find(s => s.lane === laneKey);
  if (starved) {
    return el("span", { className: "lane-next is-idle" },
      el("span", null, starved.candidate
        ? `${starved.headroom} free · nothing queued`
        : `${starved.headroom} free · no candidates`));
  }
  return null;
}

function laneHead(lane, inProg) {
  const over = inProg > WF.wip_limit;
  const open = lane.issues.filter(i => !WF.closed_statuses.includes(i.status)).length;

  const head = el("div", { className: "lane-head" },
    el("span", { className: "lane-caret" }, "▼"),
    lane.key === LANE_NONE
      ? el("span", { className: "lane-title" }, "No epic")
      : el("span", { className: "lane-key" }, lane.key),
    lane.epic ? el("span", { className: "lane-title" }, lane.epic.title) : null,
    lane.key !== LANE_NONE && lane.epic
      ? el("a", { className: "lane-open", href: "#" + lane.key,
                  title: "Open " + lane.key,
                  onclick: ev => { ev.stopPropagation(); openDrawer(lane.key); } }, "open")
      : null,
    el("span", { className: "lane-stat" },
      laneNext(lane.key),
      el("span", null, el("b", null, String(open)), " open"),
      el("span", { className: over ? "wip-over" : "" },
         el("b", null, String(inProg)), `/${WF.wip_limit} in progress`)));

  head.addEventListener("click", () => {
    if (collapsed.has(lane.key)) collapsed.delete(lane.key);
    else collapsed.add(lane.key);
    saveCollapsed();
    render();
  });
  return head;
}

function render() {
  renderKpis();
  const board = $("#board"); board.textContent = "";
  const showClosed = $("#fdone").checked;
  const grouped = $("#fepic").checked;
  const issues = BOARD.issues;
  const statuses = WF.statuses.filter(s => {
    if (!WF.closed_statuses.includes(s)) return true;
    if (!showClosed) return false;
    return s !== "cancelled" || issues.some(i => i.status === "cancelled");
  });

  // Flat mode is one headerless lane, so both modes share the column code.
  const lanes = grouped
    ? lanesOf(issues)
    : [{ key: LANE_NONE, epic: null, issues, headless: true }];

  for (const lane of lanes) {
    const laneEl = el("div", { className: "lane" });
    laneEl.dataset.lane = lane.key;
    const inProg = lane.issues.filter(i => i.status === "in_progress").length;

    if (!lane.headless) {
      if (collapsed.has(lane.key)) laneEl.classList.add("collapsed");
      laneEl.append(laneHead(lane, inProg), el("div", { className: "lane-rule" }));
    }

    /* Queue position for the todo column, so the board lists it in the same
       order `tam next` does. Unranked keys sort last, order otherwise preserved. */
    const rank = new Map((BOARD.pull?.ready || []).map((r, n) => [r.key, n]));

    const cols = el("div", { className: "lane-cols" });
    for (const status of statuses) {
      let mine = lane.issues.filter(i => i.status === status);
      if (status === "todo" && rank.size)
        mine = [...mine].sort((a, b) =>
          (rank.has(a.key) ? rank.get(a.key) : Infinity) -
          (rank.has(b.key) ? rank.get(b.key) : Infinity));
      const col = el("div", { className: "col" });
      col.dataset.status = status;
      if (status === "in_progress" && mine.length > WF.wip_limit) col.classList.add("over-wip");

      col.append(
        el("div", { className: "col-head" },
          el("span", { className: "col-title" }, status.replace("_", " ")),
          el("span", { className: "count num" },
             status === "in_progress" ? `${mine.length}/${WF.wip_limit}` : String(mine.length))),
        (() => {
          const b = el("div", { className: "col-body" });
          if (!mine.length) b.append(el("div", { className: "empty" }, "—"));
          for (const i of mine) b.append(card(i));
          return b;
        })());

      col.addEventListener("dragover", ev => {
        if (!dragKey) return;
        // Only the lane the card came from accepts it: a drop changes status,
        // never the parent, so cross-lane drops would be a lie.
        if (!col.closest(".lane")?.contains(document.querySelector(".card.dragging"))) return;
        const from = issues.find(i => i.key === dragKey);
        if (from && (WF.transitions[from.status] || []).includes(status)) {
          ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
        }
      });
      col.addEventListener("drop", ev => {
        ev.preventDefault();
        const key = dragKey || ev.dataTransfer.getData("text/plain");
        clearTargets();
        if (key) move(key, status);
      });
      cols.append(col);
    }

    laneEl.append(cols);
    board.append(laneEl);
  }
}

/* ----------------------------------------------------------- mutations */
async function move(key, status, opts = {}) {
  const body = { status, ...(opts.reason ? { reason: opts.reason } : {}),
                 ...(opts.force ? { force: true } : {}) };
  try {
    await api("POST", `/api/issues/${key}/transition`, body);
    toast(`${key} → ${status}`, "ok");
    await load(true);
    if (openKey === key) openDrawer(key, true);
  } catch (e) {
    if (!(e instanceof ApiError)) return fail(e);
    const i = e.info || {};
    // The server's guards are authoritative. Surface them; never auto-force.
    if (i.code === "validation" && i.details?.field === "reason") {
      const reason = prompt(`Why is ${key} blocked?`);
      if (reason?.trim()) return move(key, status, { reason: reason.trim() });
      return toast("cancelled — blocking needs a reason", "err");
    }
    if (i.code === "transition_denied" && i.details?.open_subtasks) {
      if (confirm(`${key} has open subtasks: ${i.details.open_subtasks.join(", ")}\n\nClose anyway?`))
        return move(key, status, { force: true });
      return toast("left open", "err");
    }
    fail(e);
  }
}

async function patch(key, fields) {
  try {
    await api("PATCH", `/api/issues/${key}`, fields);
    await load(true);
    if (openKey === key) openDrawer(key, true);
    toast("saved", "ok");
  } catch (e) { fail(e); }
}

/* ------------------------------------------------------ metric chart */
/* Single series + an optional target reference line. No legend box: the
   caption names the series. Crosshair + tooltip per the interaction rules. */
function metricChart(points, target, name) {
  const W = 540, H = 170, L = 44, R = 12, T = 12, B = 26;
  const wrap = el("div", { className: "chart-wrap" });
  const svg = svgEl("svg", { class: "plot", viewBox: `0 0 ${W} ${H}`,
                             role: "img", "aria-label": `${name} over time` });
  const vals = points.map(p => p.value);
  const ys = target != null ? vals.concat([target]) : vals;
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 0.01; lo -= 0.01; }
  const padY = (hi - lo) * 0.12; lo -= padY; hi += padY;
  const x = i => L + (i / Math.max(1, points.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  // recessive grid + axis labels
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * (k / 3), yy = y(v);
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: yy, y2: yy,
                               stroke: "var(--line-soft)", "stroke-width": 1 }));
    const t = svgEl("text", { x: L - 7, y: yy + 3.5, "text-anchor": "end",
                              fill: "var(--ink-3)", "font-size": 10 });
    t.textContent = fmt(v); svg.append(t);
  }
  if (target != null) {
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(target), y2: y(target),
                               stroke: "var(--critical)", "stroke-width": 2,
                               "stroke-dasharray": "5 4" }));
    const lab = svgEl("text", { x: W - R, y: y(target) - 6, "text-anchor": "end",
                                fill: "var(--critical)", "font-size": 10,
                                "font-weight": 600 });
    lab.textContent = `target ${fmt(target)}`; svg.append(lab);
  }
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join("");
  svg.append(svgEl("path", { d, fill: "none", stroke: "var(--series-1)",
                             "stroke-width": 2, "stroke-linecap": "round",
                             "stroke-linejoin": "round" }));
  svg.append(svgEl("circle", { cx: x(points.length - 1), cy: y(points.at(-1).value),
                               r: 4, fill: "var(--series-1)",
                               stroke: "var(--surface-1)", "stroke-width": 2 }));

  // crosshair + tooltip
  const cross = svgEl("line", { y1: T, y2: H - B, stroke: "var(--ink-3)",
                                "stroke-width": 1, opacity: 0 });
  const dot = svgEl("circle", { r: 4, fill: "var(--series-1)",
                                stroke: "var(--surface-1)", "stroke-width": 2, opacity: 0 });
  svg.append(cross, dot);
  const tip = el("div", { className: "tip" });
  wrap.append(svg, tip);

  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    let i = Math.round(((px - L) / (W - L - R)) * (points.length - 1));
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("opacity", .5);
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.value));
    dot.setAttribute("opacity", 1);
    // Built from text nodes, not innerHTML: p.step and p.at are server data
    // but need not be trusted as markup.
    tip.textContent = "";
    tip.append(el("b", {}, fmt(p.value)));
    if (p.step != null) tip.append(` · step ${p.step}`);
    tip.append(el("br"),
      el("span", { style: "color:var(--ink-3)" },
         (p.at || "").slice(0, 16).replace("T", " ")));
    tip.classList.add("on");
    tip.style.left = Math.min(r.width - 130, Math.max(0, (x(i) / W) * r.width - 55)) + "px";
    tip.style.top = ((y(p.value) / H) * r.height - 52) + "px";
  });
  svg.addEventListener("pointerleave", () => {
    cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
    tip.classList.remove("on");
  });
  return wrap;
}

/* -------------------------------------------------------------- drawer */
function closeDrawer() {
  openKey = null;
  $("#drawer").classList.remove("open");
  $("#scrim").classList.remove("open");
  if (location.hash) history.replaceState(null, "", location.pathname);
}

async function openDrawer(key, keepScroll) {
  openKey = key;
  const d = $("#drawer");
  const scroll = keepScroll ? d.scrollTop : 0;
  d.classList.add("open"); $("#scrim").classList.add("open");
  if (location.hash.slice(1) !== key) history.replaceState(null, "", "#" + key);
  d.textContent = "loading…";

  let issue, metrics = [], targets = [];
  try {
    issue = await api("GET", `/api/issues/${key}?comments=1&history=1`);
    targets = (await api("GET", `/api/targets?issue=${key}`)) || [];
    metrics = (await api("GET", `/api/issues/${key}/metrics?limit=200`)) || [];
  } catch (e) { fail(e); return closeDrawer(); }
  if (openKey !== key) return;

  d.textContent = "";
  d.append(el("div", { className: "dhead" },
    el("div", {},
      el("div", { className: "key" }, `${issue.key} · ${issue.project}`),
      el("h2", {}, issue.title)),
    el("button", { className: "btn btn-sm", onclick: closeDrawer, title: "Close (Esc)" }, "✕")));

  // -- editable fields
  const statusSel = el("select");
  const reachable = [issue.status, ...(issue.next_statuses || [])];
  for (const s of WF.statuses) {
    const o = el("option", { value: s }, s.replace("_", " "));
    o.disabled = !reachable.includes(s); o.selected = s === issue.status;
    statusSel.append(o);
  }
  statusSel.onchange = () => move(issue.key, statusSel.value);

  const priSel = el("select");
  for (const p of WF.priorities) {
    const o = el("option", { value: p }, `${p} ${WF.priority_labels[p]}`);
    o.selected = p === issue.priority; priSel.append(o);
  }
  priSel.onchange = () => patch(issue.key, { priority: priSel.value });

  const typeSel = el("select");
  for (const t of WF.types) {
    const o = el("option", { value: t }, t); o.selected = t === issue.type; typeSel.append(o);
  }
  typeSel.onchange = () => patch(issue.key, { type: typeSel.value });

  const dueIn = el("input", { type: "date", value: issue.due_date || "" });
  dueIn.onchange = () => patch(issue.key, { due_date: dueIn.value || null });

  d.append(el("div", { className: "grid2" },
    el("div", { className: "field" }, el("label", {}, "Status"), statusSel),
    el("div", { className: "field" }, el("label", {}, "Priority"), priSel),
    el("div", { className: "field" }, el("label", {}, "Type"), typeSel),
    el("div", { className: "field" }, el("label", {}, "Due"), dueIn)));

  const asg = el("input", { type: "text", value: issue.assignee || "", placeholder: "unassigned" });
  asg.onchange = () => patch(issue.key, { assignee: asg.value.trim() || null });
  const labels = el("input", { type: "text", value: issue.labels.join(" "),
                               placeholder: "space separated" });
  labels.onchange = () => patch(issue.key,
    { labels: labels.value.split(/\s+/).filter(Boolean) });
  d.append(el("div", { className: "grid2" },
    el("div", { className: "field" }, el("label", {}, "Assignee"), asg),
    el("div", { className: "field" }, el("label", {}, "Labels"), labels)));

  const title = el("input", { type: "text", value: issue.title });
  title.onchange = () => { if (title.value.trim()) patch(issue.key, { title: title.value.trim() }); };
  d.append(el("div", { className: "field" }, el("label", {}, "Title"), title));
  const body = el("textarea", {}); body.value = issue.body || "";
  body.onchange = () => patch(issue.key, { body: body.value });
  d.append(el("div", { className: "field" }, el("label", {}, "Description"), body));

  // -- watches
  const ws = BOARD.watches[issue.key] || [];
  if (ws.length) {
    const sec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "Watched"));
    for (const w of ws)
      sec.append(el("div", { className: "entry row" },
        stateBadge(w.state, w.native_state || w.state),
        el("span", { className: "chip" }, `${w.provider}:${w.ref}`),
        el("span", { className: "who", style: "margin-left:auto" },
           (w.last_seen || "").slice(0, 16).replace("T", " "))));
    d.append(sec);
  }

  // -- targets, as meters against their limit
  if (targets.length) {
    const sec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "Targets"));
    for (const t of targets) {
      const pct = t.actual != null && t.value ? Math.min(100, (t.actual / t.value) * 100) : 0;
      sec.append(el("div", { className: "target" },
        el("div", { className: "target-top" },
          el("b", {}, t.metric),
          el("span", { className: "who" }, `${t.op} ${fmt(t.value)}`),
          stateBadge(t.met ? "succeeded" : t.actual == null ? "unknown" : "failed",
                     t.status),
          el("span", { className: "target-gap num" },
             t.actual == null ? "" : `${fmt(t.actual)}${t.met ? "" : ` · gap ${t.gap > 0 ? "+" : ""}${fmt(t.gap)}`}`)),
        el("div", { className: "meter" }, el("i", { style: `width:${pct}%` }))));
    }
    d.append(sec);
  }

  // -- metric chart
  const byName = {};
  for (const p of metrics) (byName[p.name] ||= []).push(p);
  const names = Object.keys(byName).filter(n => byName[n].length > 1);
  if (names.length) {
    const sec = el("div", { className: "sec" });
    const sel = el("select", { style: "margin-left:auto" });
    for (const n of names) sel.append(el("option", { value: n }, n));
    const tableBtn = el("button", { className: "btn btn-sm" }, "Table");
    sec.append(el("div", { className: "sec-title" }, "Metric", sel, tableBtn));
    const holder = el("div");
    sec.append(holder);

    let asTable = false;
    const draw = () => {
      holder.textContent = "";
      const name = sel.value, pts = byName[name];
      const tgt = targets.find(t => t.metric === name);
      if (asTable) {
        const tb = el("table", { className: "data" },
          el("tr", {}, el("th", {}, "step"), el("th", {}, "value"), el("th", {}, "at")));
        for (const p of pts.slice(-40))
          tb.append(el("tr", {}, el("td", { className: "num" }, p.step ?? "—"),
                       el("td", { className: "num" }, fmt(p.value)),
                       el("td", { className: "who" }, (p.at || "").slice(0, 16).replace("T", " "))));
        holder.append(tb);
      } else {
        holder.append(metricChart(pts, tgt ? tgt.value : null, name));
        holder.append(el("figcaption", {},
          `${name}, ${pts.length} observations` +
          (tgt ? ` · dashed line is the ${tgt.op} ${fmt(tgt.value)} target` : "")));
      }
    };
    sel.onchange = draw;
    tableBtn.onclick = () => { asTable = !asTable; tableBtn.textContent = asTable ? "Chart" : "Table"; draw(); };
    draw();
    d.append(sec);
  }

  // -- subtasks / links
  if (issue.subtasks?.length) {
    const sec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "Subtasks"));
    for (const s of issue.subtasks)
      sec.append(el("div", { className: "entry row" },
        el("a", { className: "link", href: "#" + s.key,
                  onclick: e => { e.preventDefault(); openDrawer(s.key); } }, s.key),
        el("span", {}, s.title),
        el("span", { className: "who", style: "margin-left:auto" }, s.status)));
    d.append(sec);
  }
  if (issue.links?.length) {
    const sec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "Links"));
    for (const l of issue.links)
      sec.append(el("div", { className: "entry row" },
        el("span", { className: "chip" }, l.type.replace("_", " ")),
        el("a", { className: "link", href: "#" + l.to,
                  onclick: e => { e.preventDefault(); openDrawer(l.to); } }, l.to),
        el("span", {}, l.to_title),
        el("span", { className: "who", style: "margin-left:auto" }, l.to_status)));
    d.append(sec);
  }

  // -- comments
  const csec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "Comments"));
  for (const c of issue.comments || [])
    csec.append(el("div", { className: "entry" },
      el("div", { className: "who" }, `${c.author} · ${(c.created_at || "").slice(0, 16).replace("T", " ")}`),
      el("div", { style: "white-space:pre-wrap" }, c.body)));
  const cbox = el("textarea", { placeholder: "Add a comment…" });
  const cbtn = el("button", { className: "btn btn-pri btn-sm" }, "Comment");
  cbtn.onclick = async () => {
    if (!cbox.value.trim()) return;
    try {
      await api("POST", `/api/issues/${issue.key}/comments`, { body: cbox.value.trim() });
      cbox.value = ""; openDrawer(issue.key, true);
    } catch (e) { fail(e); }
  };
  csec.append(cbox, el("div", { className: "row", style: "margin-top:6px" }, cbtn));
  d.append(csec);

  // -- history
  const hsec = el("div", { className: "sec" }, el("div", { className: "sec-title" }, "History"));
  for (const h of issue.history || []) {
    const text = h.kind === "transitioned" ? `${h.old} → ${h.new}`
      : h.kind === "updated" ? `${h.field}: ${h.old ?? "∅"} → ${h.new ?? "∅"}`
      : h.kind === "commented" ? "commented"
      : ["linked", "unlinked"].includes(h.kind) ? `${h.kind} ${h.field} ${h.new || h.old}`
      : h.kind;
    hsec.append(el("div", { className: "hist" },
      `${(h.at || "").slice(0, 16).replace("T", " ")}  ${h.actor}  ${text}${h.note ? "  (" + h.note + ")" : ""}`));
  }
  d.append(hsec);

  const del = el("button", { className: "btn btn-sm btn-danger" }, "Delete issue");
  del.onclick = async () => {
    if (!confirm(`Delete ${issue.key} permanently?\n\nIts history is kept.`)) return;
    try { await api("DELETE", `/api/issues/${issue.key}`); toast(`deleted ${issue.key}`, "ok");
          closeDrawer(); load(true); } catch (e) { fail(e); }
  };
  d.append(el("div", { className: "sec" }, del));
  d.scrollTop = scroll;
}

/* --------------------------------------------------------------- wiring */
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function boot() {
  try { WF = await api("GET", "/api/workflow"); }
  catch {
    document.body.innerHTML =
      '<p style="padding:24px">Could not reach the TAM API. Is <code>bin/tam-api</code> running?</p>';
    return;
  }
  $("#proj").textContent = WF.default_project;
  for (const [sel, vals, def] of [["#n-pri", WF.priorities, "p2"],
                                  ["#n-type", WF.types, "task"],
                                  ["#n-status", WF.statuses, "backlog"]]) {
    const s = $(sel);
    for (const v of vals) {
      const o = el("option", { value: v }, v.replace("_", " "));
      o.selected = v === def; s.append(o);
    }
  }
  $("#refresh").onclick = () => load();
  $("#q").addEventListener("input", debounce(() => load(true), 250));
  for (const id of ["#fpri", "#fover", "#fdone"]) $(id).onchange = () => load(true);
  // Grouping is a pure view concern -- no new data, so re-render rather than refetch.
  $("#fepic").onchange = () => render();
  $("#scrim").onclick = closeDrawer;
  $("#new").onclick = () => {
    $("#newform").reset();
    $("#n-pri").value = "p2"; $("#n-type").value = "task"; $("#n-status").value = "backlog";
    $("#newdlg").showModal(); $("#n-title").focus();
  };
  $("#newdlg").addEventListener("close", async () => {
    if ($("#newdlg").returnValue !== "create") return;
    const title = $("#n-title").value.trim();
    if (!title) return;
    const payload = { title, body: $("#n-body").value, priority: $("#n-pri").value,
                      type: $("#n-type").value, status: $("#n-status").value };
    if ($("#n-due").value) payload.due_date = $("#n-due").value;
    const labels = $("#n-labels").value.split(/\s+/).filter(Boolean);
    if (labels.length) payload.labels = labels;
    try { const made = await api("POST", "/api/issues", payload);
          toast(`created ${made.key}`, "ok"); await load(true); }
    catch (e) {
      if (e instanceof ApiError && e.info?.details?.field === "reason") {
        const reason = prompt("Why is this blocked?");
        if (reason?.trim()) {
          payload.reason = reason.trim();
          try { const made = await api("POST", "/api/issues", payload);
                toast(`created ${made.key}`, "ok"); return load(true); }
          catch (e2) { return fail(e2); }
        }
      }
      fail(e);
    }
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") closeDrawer();
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) || ev.metaKey || ev.ctrlKey) return;
    if (ev.key === "r") { ev.preventDefault(); load(); }
    if (ev.key === "n") { ev.preventDefault(); $("#new").click(); }
    if (ev.key === "/") { ev.preventDefault(); $("#q").focus(); }
  });

  await load();
  const deep = location.hash.slice(1).toUpperCase();
  if (/^[A-Z][A-Z0-9]{1,9}-\d+$/.test(deep)) openDrawer(deep);
  addEventListener("hashchange", () => {
    const k = location.hash.slice(1).toUpperCase();
    if (k && k !== openKey) openDrawer(k); else if (!k && openKey) closeDrawer();
  });
  // never refetch under an open drawer or an in-flight drag
  setInterval(() => { if (!openKey && !dragKey) load(true); }, 30000);
}
boot();
</script>
</body>
</html>
